baseURL = 'https://iceberg.dbj.org/'
languageCode = 'en-us'
title = 'DBJ Iceberg'
theme = 'PaperMod'
paginate = 10
copyright = '&copy; dbj.org'

[params]
  author = 'Dusan B. Jovanovic'
  description = 'AI ROI — for the Business, Products and Technology'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  comments = true
  TocOpen = false
  defaultTheme = 'auto'
  homeInfoParams = { Title = 'DBJ Iceberg', Content = 'Safely navigate the AI adoption. Free of hype.' }
  homeGridStyle = true

[params.footer]
  text = 'CC BY SA 4.0 · [IP Advisory](/ip-advisory/)'

[params.profileMode]
  enabled = false

# [[params.socialIcons]]
#  name = 'github'
#  url = 'https://github.com/DBJARH'

[params.giscus]
  repo = "DBJARH/DBJ_ICEBERG"
  repoId = "R_kgDOSkKOjw"
  category = "General"
  categoryId = "DIC_kwDOSkKOj84C-ROl"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "top"
  theme = "preferred_color_scheme"
  lang = "en"
  loading = "lazy"

[taxonomies]
  tag = 'tags'
  category = 'categories'
  chapter = 'chapters'

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[menu]
  [[menu.main]]
    name = 'Posts'
    url = '/posts/'
    weight = 1
  [[menu.main]]
    name = 'Search'
    url = '/search/'
    weight = 2
